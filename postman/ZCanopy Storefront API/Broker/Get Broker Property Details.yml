info:
  name: Get Broker Property Details
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/web/broker/properties/{{propertyId}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
