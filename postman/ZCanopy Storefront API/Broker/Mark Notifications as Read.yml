info:
  name: Mark Notifications as Read
  type: http
  seq: 17

http:
  method: POST
  url: "{{baseUrl}}/web/broker/notifications/mark-read"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "notificationIds": ["n1", "n2"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
