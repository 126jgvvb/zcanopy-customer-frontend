info:
  name: Subscribe to Plan
  type: http
  seq: 14

http:
  method: POST
  url: "{{baseUrl}}/web/broker/subscribe"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "packageId": "premium"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
