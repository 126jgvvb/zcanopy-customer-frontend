info:
  name: Update Booking Status
  type: http
  seq: 8

http:
  method: PUT
  url: "{{baseUrl}}/web/broker/bookings/{{bookingId}}/status"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "status": "approved"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
