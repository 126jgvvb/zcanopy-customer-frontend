info:
  name: Update Property
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/web/broker/properties/{{propertyId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "title": "Updated Property",
        "description": "Updated description"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
