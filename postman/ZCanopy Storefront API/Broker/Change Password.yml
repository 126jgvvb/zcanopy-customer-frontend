info:
  name: Change Password
  type: http
  seq: 20

http:
  method: POST
  url: "{{baseUrl}}/web/broker/change-password"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "currentPassword": "oldpass",
        "newPassword": "newpass"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
