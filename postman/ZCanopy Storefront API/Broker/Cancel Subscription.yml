info:
  name: Cancel Subscription
  type: http
  seq: 15

http:
  method: POST
  url: "{{baseUrl}}/subscriptions/cancel"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: "{}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
