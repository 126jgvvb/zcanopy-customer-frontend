info:
  name: Withdraw Funds
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/web/broker/withdraw"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "amount": 100000
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
