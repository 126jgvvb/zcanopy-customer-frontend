info:
  name: Search Customer Properties
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/web/customer/search?q={{query}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  params:
    - name: q
      value: "{{query}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
