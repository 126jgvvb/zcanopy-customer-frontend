info:
  name: Get Property Comments
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/web/customer/properties/{{propertyId}}/comments"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
