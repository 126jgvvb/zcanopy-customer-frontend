info:
  name: Get Broker Properties for Customer
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/web/customer/broker/{{brokerCode}}/properties"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
