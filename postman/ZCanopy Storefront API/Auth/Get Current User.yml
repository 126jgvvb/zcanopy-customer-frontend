info:
  name: Get Current User
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/web/auth/me"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
