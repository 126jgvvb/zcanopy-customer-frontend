info:
  name: Broker Setup
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/web/auth/broker/setup"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "brokerCode": "BRK-001",
        "password": "newpassword"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
