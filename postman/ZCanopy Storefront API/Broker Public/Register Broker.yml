info:
  name: Register Broker
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/broker/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "fullName": "John Doe",
        "email": "john@example.com",
        "phoneNumber": "+256700000000",
        "location": "Kampala"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
