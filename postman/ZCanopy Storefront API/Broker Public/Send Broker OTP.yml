info:
  name: Send Broker OTP
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/broker/otp/send"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "john@example.com",
        "phoneNumber": "+256700000000"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
