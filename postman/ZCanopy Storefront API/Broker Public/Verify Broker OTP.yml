info:
  name: Verify Broker OTP
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/broker/otp/verify"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "john@example.com",
        "otp": "123456"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
