info:
  name: Search Properties
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/web/public/search?q={{query}}"
  params:
    - name: q
      value: "{{query}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
