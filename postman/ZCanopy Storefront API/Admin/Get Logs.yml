info:
  name: Get Logs
  type: http
  seq: 32

http:
  method: GET
  url: "{{baseUrl}}/admin/logs"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
