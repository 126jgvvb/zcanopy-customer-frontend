info:
  name: Get Pending Verifications
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/admin/pending/verifications"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
