info:
  name: Get System Messages
  type: http
  seq: 26

http:
  method: GET
  url: "{{baseUrl}}/admin/system/messages"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
