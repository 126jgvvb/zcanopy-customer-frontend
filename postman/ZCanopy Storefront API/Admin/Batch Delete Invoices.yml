info:
  name: Batch Delete Invoices
  type: http
  seq: 36

http:
  method: DELETE
  url: "{{baseUrl}}/admin/invoices/batch-delete"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "invoiceIds": ["inv1", "inv2"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
