info:
  name: Get Property Details (Admin)
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/admin/properties/{{propertyId}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
