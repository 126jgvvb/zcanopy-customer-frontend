info:
  name: Get All Admins
  type: http
  seq: 20

http:
  method: GET
  url: "{{baseUrl}}/admin/admins"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
