info:
  name: Generate Invitation Code
  type: http
  seq: 24

http:
  method: POST
  url: "{{baseUrl}}/admin/invitation-code"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "role": "admin"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
