info:
  name: Add Admin
  type: http
  seq: 21

http:
  method: POST
  url: "{{baseUrl}}/admin/admins"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "username": "newadmin",
        "email": "admin@example.com",
        "password": "password",
        "role": "admin"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
