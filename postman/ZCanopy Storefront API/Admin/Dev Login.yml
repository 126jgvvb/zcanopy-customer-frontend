info:
  name: Dev Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/dev-login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
