info:
  name: Get Recent Signups
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/admin/recent/signups"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
