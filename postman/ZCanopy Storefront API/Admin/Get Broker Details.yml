info:
  name: Get Broker Details
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseUrl}}/admin/brokers/{{brokerId}}/details"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
