info:
  name: Get Current Commission
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/admin/commission/current"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
