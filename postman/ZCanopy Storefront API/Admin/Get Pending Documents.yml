info:
  name: Get Pending Documents
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/admin/pending/documents"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
