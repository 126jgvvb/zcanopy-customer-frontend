info:
  name: Freeze/Unfreeze Admin
  type: http
  seq: 23

http:
  method: PUT
  url: "{{baseUrl}}/admin/admins/{{adminId}}/freeze"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "isActive": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
