info:
  name: Edit Broker Tier
  type: http
  seq: 19

http:
  method: PUT
  url: "{{baseUrl}}/admin/brokers/{{brokerId}}/tier"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "tier": "premium"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
